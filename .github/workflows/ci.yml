name: CI

# Runs the test suite on every push and every pull request — no build/package
# step here on purpose, that only happens on a version tag (see release.yml).
on:
  push:
    branches: [ '**' ]  # branch pushes only — a bare `push:` also fires on tags,
                         # which would double up with release.yml on every `v*` push.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # commonTest (incl. the Compose UI tests under runComposeUiTest) is run
      # against the desktop/JVM target. It's the only target that can execute
      # those tests without extra setup: Android's local unit tests would need
      # Robolectric wired up (not done yet — they NPE without it), and the iOS
      # targets need a macOS runner. desktopTest still compiles and exercises
      # every commonTest source file, so coverage isn't actually narrower.
      - name: Run tests
        run: ./gradlew :composeApp:desktopTest --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-report
          path: composeApp/build/reports/tests/desktopTest/

      # No test sources in :server yet, so this is effectively a compile check —
      # still worth having, since nothing else in CI ever touches this module and
      # it could silently stop building otherwise. jvmToolchain(21) in its
      # build.gradle.kts pulls its own JDK via the foojay resolver regardless of
      # the java-version set up above.
      - name: Build and test server module
        run: ./gradlew :server:test --console=plain

  docker-build:
    name: Server Docker build (sanity check, not pushed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build-only, no push — release.yml's server-docker job does the real
      # push to GHCR on a version tag. This just catches a broken
      # server/Dockerfile (or a server change it can't build) on every PR,
      # instead of only discovering that at release time.
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
