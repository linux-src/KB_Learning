#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8

# Dependency-download resilience: default (10s connect / 10s read) is too
# tight for a cold Gradle cache pulling AGP's ~150MB classpath over a slow
# or congested link (seen in practice: the server/Dockerfile build stage
# timing out on a single large artifact from dl.google.com even though
# smaller ones nearby succeeded). 3 minutes each still fails fast on a truly
# dead connection, it just stops treating "slow" as "broken".
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
systemProp.https.connectionTimeout=180000
systemProp.https.socketTimeout=180000

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

kotlin.native.disableCompilerDaemon=true
