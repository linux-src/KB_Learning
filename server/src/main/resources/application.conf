ktor {
    deployment {
        port = 8080
        host = "0.0.0.0"
    }
    application {
        modules = [ dev.kbwallet.server.ApplicationKt.module ]
    }
}

jwt {
    # Dev-only fallback so local runs work with zero setup. Production MUST
    # override this via the JWT_SECRET env var — anyone with this repo can
    # otherwise forge valid tokens.
    secret = "dev-only-insecure-secret-do-not-use-in-production"
    secret = ${?JWT_SECRET}
    issuer = "kbwallet-server"
    audience = "kbwallet-users"
    accessTokenExpirationMs = 86400000       # 24 hours
    refreshTokenExpirationMs = 604800000      # 7 days
}

password {
    iterations = 10000
    keyLength = 256
}

cors {
    # Comma-separated host:port list (no scheme). Override via CORS_ALLOWED_HOSTS
    # in production with your real client-facing domain(s).
    allowedHosts = "localhost:8080,10.0.2.2:8080"
    allowedHosts = ${?CORS_ALLOWED_HOSTS}
}

database {
    # `enabled` is the real switch between durable Postgres storage and the
    # non-durable InMemoryUserRepository fallback (see configureDependencies())
    # — defaults to off so `./gradlew :server:run` still works with zero setup;
    # docker-compose.yml sets DATABASE_ENABLED=true alongside its postgres
    # service, and any real deployment MUST set it too.
    enabled = false
    enabled = ${?DATABASE_ENABLED}
    url = "jdbc:postgresql://localhost:5432/kbwallet"
    url = ${?DATABASE_URL}
    user = "kbwallet"
    user = ${?DATABASE_USER}
    password = "kbwallet"
    password = ${?DATABASE_PASSWORD}
}
